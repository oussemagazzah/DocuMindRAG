# Pinned rule set so local runs and CI agree regardless of ruff's changing defaults.
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "vemv", "alembic/versions"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[lint.flake8-bugbear]
# FastAPI declares parameters with call defaults such as File(...) and Query(...).
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Depends", "fastapi.Body"]

[lint.per-file-ignores]
# Alembic needs sys.path set up before importing the app.
"alembic/env.py" = ["E402"]
